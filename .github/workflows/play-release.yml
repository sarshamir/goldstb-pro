name: Build signed Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: unzip -q GOLDSTB_PRO_Starter_Source.zip

      - name: Restore private upload key
        working-directory: GOLDSTB_PRO
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-key.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release bundle
        working-directory: GOLDSTB_PRO
        run: gradle --no-daemon :app:bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/GOLDSTB_PRO/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: GOLDSTB-PRO-play-release-aab
          path: GOLDSTB_PRO/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
