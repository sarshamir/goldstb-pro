name: Build GOLDSTB PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: unzip -q GOLDSTB_PRO_Starter_Source.zip

      - name: Build debug APK
        working-directory: GOLDSTB_PRO
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOLDSTB-PRO-debug-apk
          path: GOLDSTB_PRO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
