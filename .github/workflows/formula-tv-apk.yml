name: Formula TV testing APK
on:
  push:
    branches: [formula-tv-testing]
    paths: ['FormulaTV/**', '.github/workflows/formula-tv-apk.yml']
  workflow_dispatch:
concurrency:
  group: formula-tv-testing
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Keep a stable testing signature
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: formula-tv-testing-debug-key-v1
      - name: Build and test Formula TV
        working-directory: FormulaTV
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Prepare testing APK
        run: cp FormulaTV/app/build/outputs/apk/debug/app-debug.apk FormulaTV-v0.4.0-testing.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FormulaTV-v0.4.0-testing
          path: FormulaTV-v0.4.0-testing.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch phone and landscape smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            bash -c 'status=0; gradle --no-daemon -p FormulaTV :app:connectedDebugAndroidTest || status=$?; adb pull /sdcard/Android/data/com.formulatv.player/files/screenshots ./screenshots || true; adb logcat -d -s AndroidRuntime:E > runtime-errors.txt; exit "$status"'
            test ! -s runtime-errors.txt || ! grep -q 'FATAL EXCEPTION' runtime-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FormulaTV-smoke-test
          path: |
            screenshots/
            runtime-errors.txt
            FormulaTV/app/build/reports/tests/testDebugUnitTest/
            FormulaTV/app/build/reports/androidTests/connected/
            FormulaTV/app/build/reports/lint-results-debug.html
          retention-days: 14

