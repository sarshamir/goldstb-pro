name: Formula TV testing APK
on:
  push:
    branches: [formula-tv-testing]
    paths: ['FormulaTV/**', '.github/workflows/formula-tv-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and test Formula TV
        working-directory: FormulaTV
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare testing APK
        run: cp FormulaTV/app/build/outputs/apk/debug/app-debug.apk FormulaTV-v0.2.0-testing.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FormulaTV-v0.2.0-testing
          path: FormulaTV-v0.2.0-testing.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch phone and landscape smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r FormulaTV-v0.2.0-testing.apk
            adb logcat -c
            adb shell am start -n com.formulatv.player/.MainActivity
            sleep 4
            adb shell pidof com.formulatv.player
            adb shell screencap -p /sdcard/phone.png
            adb pull /sdcard/phone.png phone.png
            adb shell input keyevent 23
            sleep 2
            adb shell screencap -p /sdcard/source.png
            adb pull /sdcard/source.png source.png
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2
            adb shell screencap -p /sdcard/landscape.png
            adb pull /sdcard/landscape.png landscape.png
            adb logcat -d -s AndroidRuntime:E > runtime-errors.txt
            test ! -s runtime-errors.txt || ! grep -q 'FATAL EXCEPTION' runtime-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FormulaTV-smoke-test
          path: |
            phone.png
            source.png
            landscape.png
            runtime-errors.txt
            FormulaTV/app/build/reports/tests/testDebugUnitTest/
            FormulaTV/app/build/reports/lint-results-debug.html
          retention-days: 14
